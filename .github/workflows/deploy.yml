name: Deploy no PythonAnywhere

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar no PythonAnywhere
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependência do deploy
        run: python -m pip install requests python-dotenv

      - name: Gerar .env.dev temporário com secrets
        env:
          AMBIENTE: ${{ secrets.AMBIENTE }}
          CACHE_TTL: ${{ secrets.CACHE_TTL }}
          DOMINIOS_PERMITIDOS: ${{ secrets.DOMINIOS_PERMITIDOS }}
          API_KEYS_PERMITIDAS: ${{ secrets.API_KEYS_PERMITIDAS }}
          DB_CONNECT: ${{ secrets.DB_CONNECT }}
          DB_POOL_PRE_PING: ${{ secrets.DB_POOL_PRE_PING }}
          DB_POOL_RECYCLE: ${{ secrets.DB_POOL_RECYCLE }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          TOKEN_EXPA: ${{ secrets.TOKEN_EXPA }}
          APPSCRIPT_EXPA: ${{ secrets.APPSCRIPT_EXPA }}
        run: |
          python - <<'PY'
          import os
          from dotenv import set_key

          names = (
              "AMBIENTE", "CACHE_TTL", "DOMINIOS_PERMITIDOS", "API_KEYS_PERMITIDAS",
              "DB_CONNECT", "DB_POOL_PRE_PING", "DB_POOL_RECYCLE", "CLIENT_ID",
              "CLIENT_SECRET", "APP_ID", "APP_TOKEN", "TOKEN_EXPA", "APPSCRIPT_EXPA",
          )
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit("Configure these Back repository Actions secrets: " + ", ".join(missing))
          for name in names:
              set_key(".env.dev", name, os.environ[name], quote_mode="always")
          PY

      - name: Enviar os arquivos definidos e recarregar a webapp
        env:
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
          DB_CONNECT: ${{ secrets.DB_CONNECT }}
          DOMINIOS_PERMITIDOS: ${{ secrets.DOMINIOS_PERMITIDOS }}
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from dotenv import set_key

          def required_env(name):
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"Missing Actions secret: {name}")
              return value

          username = required_env("PYTHONANYWHERE_USERNAME")
          api_token = required_env("PYTHONANYWHERE_API_TOKEN")
          domain = required_env("PYTHONANYWHERE_DOMAIN")
          overrides = {
              "DB_CONNECT": required_env("DB_CONNECT"),
              "DOMINIOS_PERMITIDOS": required_env("DOMINIOS_PERMITIDOS"),
          }

          project_dir = Path.cwd()
          remote_dir = f"/home/{username}/Back-Cadastro-Interesse-Intercambio"
          allowed_dirs = {"app", "doc"}
          allowed_files = {".env.dev", "requirements.txt", "server.py"}
          ignored_dirs = {"__pycache__", ".pytest_cache", ".git", ".vscode", ".idea"}
          headers = {"Authorization": f"Token {api_token}"}
          session = requests.Session()
          session.headers.update(headers)

          env_file = project_dir / ".env.dev"
          if not env_file.is_file():
              raise SystemExit("Temporary .env.dev was not generated")
          for key, value in overrides.items():
              set_key(str(env_file), key, value, quote_mode="always")

          files = []
          for name in sorted(allowed_files):
              path = project_dir / name
              if path.is_file():
                  files.append(path)
          for dirname in sorted(allowed_dirs):
              base = project_dir / dirname
              if not base.is_dir():
                  continue
              for root, dirs, filenames in os.walk(base):
                  dirs[:] = sorted(d for d in dirs if d not in ignored_dirs)
                  for filename in sorted(filenames):
                      path = Path(root) / filename
                      if path.suffix not in {".pyc", ".pyo"}:
                          files.append(path)

          files.sort(key=lambda path: path.relative_to(project_dir).as_posix())
          if not files:
              raise SystemExit("No files matched the deployment allowlist")

          for index, path in enumerate(files, start=1):
              relative_path = path.relative_to(project_dir).as_posix()
              remote_path = f"{remote_dir}/{relative_path}"
              encoded_path = quote(remote_path, safe="/")
              url = f"https://www.pythonanywhere.com/api/v0/user/{quote(username, safe='')}/files/path{encoded_path}"
              uploaded = False
              for attempt in range(3):
                  try:
                      with path.open("rb") as stream:
                          response = session.post(
                              url,
                              files={"content": (path.name, stream)},
                              timeout=60,
                          )
                      if response.status_code in (200, 201):
                          uploaded = True
                          break
                      if response.status_code == 429 and attempt < 2:
                          time.sleep(int(response.headers.get("Retry-After", "10")))
                          continue
                      if response.status_code >= 500 and attempt < 2:
                          time.sleep(2 ** attempt)
                          continue
                      raise SystemExit(f"Upload failed for {relative_path}: HTTP {response.status_code}")
                  except requests.RequestException as error:
                      if attempt == 2:
                          raise SystemExit(f"Upload failed for {relative_path}: {type(error).__name__}")
                      time.sleep(2 ** attempt)
              if not uploaded:
                  raise SystemExit(f"Upload failed for {relative_path}")
              print(f"Uploaded {index}/{len(files)}: {relative_path}")
              time.sleep(1.6)

          reload_url = (
              "https://www.pythonanywhere.com/api/v0/user/"
              f"{quote(username, safe='')}/webapps/{quote(domain, safe='')}/reload/"
          )
          response = session.post(reload_url, timeout=60)
          if response.status_code != 200:
              raise SystemExit(f"Webapp reload failed: HTTP {response.status_code}")
          print("PythonAnywhere webapp reloaded successfully")
          PY