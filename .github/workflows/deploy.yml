name: Deploy no PythonAnywhere
run-name: "Deploy Back | ${{ github.event.head_commit.message || github.event_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Publicar no PythonAnywhere
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependências do deploy
        run: python -m pip install requests python-dotenv pytz

      - name: Sincronizar arquivos e recarregar WebApp
        id: deploy
        env:
          AMBIENTE: ${{ secrets.AMBIENTE }}
          CACHE_TTL: ${{ secrets.CACHE_TTL }}
          DOMINIOS_PERMITIDOS: ${{ secrets.DOMINIOS_PERMITIDOS }}
          API_KEYS_PERMITIDAS: ${{ secrets.API_KEYS_PERMITIDAS }}
          TOKEN_EXPA: ${{ secrets.TOKEN_EXPA }}
          APPSCRIPT_EXPA: ${{ secrets.APPSCRIPT_EXPA }}
          APPSCRIPT_B2C: ${{ secrets.APPSCRIPT_B2C }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_DOMAIN: ${{ secrets.PYTHONANYWHERE_DOMAIN }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import tempfile
          import time
          from pathlib import Path
          from urllib.parse import quote

          import requests
          from dotenv import set_key

          APP_ENV_NAMES = (
              "AMBIENTE", "CACHE_TTL", "DOMINIOS_PERMITIDOS", "API_KEYS_PERMITIDAS",
              "TOKEN_EXPA", "APPSCRIPT_EXPA", "APPSCRIPT_B2C",
          )
          ALLOWED_DIRS = {"app", "doc"}
          ALLOWED_FILES = {".env.example", "requirements.txt", "server.py"}
          IGNORED_SUBDIRS = {"__pycache__", ".pytest_cache", ".git", ".vscode", ".idea"}
          PROTECTED_REMOTE_FILES = {".env.dev", ".env.test"}
          CREATED_DIRS = set()

          def required_env(name):
              value = os.environ.get(name)
              if not value:
                  raise SystemExit(f"Configure o Actions secret obrigatório: {name}")
              return value

          def load_config():
              username = required_env("PYTHONANYWHERE_USERNAME")
              session = requests.Session()
              session.headers.update({
                  "Authorization": f"Token {required_env('PYTHONANYWHERE_API_TOKEN')}"
              })
              return {
                  "username": username,
                  "domain": required_env("PYTHONANYWHERE_DOMAIN"),
                  "project_dir": Path.cwd(),
                  "remote_dir": f"/home/{username}/Back-Cadastro-Interesse-Intercambio",
                  "app_env": {name: required_env(name) for name in APP_ENV_NAMES},
                  "session": session,
              }

          def api_url(config, path):
              api_user = quote(config["username"], safe="")
              return f"https://www.pythonanywhere.com/api/v0/user/{api_user}{path}"

          def delete_remote_path(config, remote_path):
              """Apaga um arquivo ou diretório no PythonAnywhere."""
              url = api_url(config, f"/files/path{quote(remote_path, safe='/')}")
              response = config["session"].delete(url, timeout=60)
              if response.status_code in (204, 404):
                  return True
              print(f"ERRO [{response.status_code}] ao excluir {remote_path}")
              return False

          def get_remote_file_tree(config):
              """Obtém a lista de caminhos de arquivos/pastas existentes no servidor remoto."""
              url = api_url(config, f"/files/tree/?path={quote(config['remote_dir'], safe='/')}")
              response = config["session"].get(url, timeout=60)
              if response.status_code == 200:
                  raw_paths = response.json()
                  remote_prefix = config["remote_dir"].rstrip("/") + "/"
                  relative_paths = set()
                  for path in raw_paths:
                      if path.startswith(remote_prefix):
                          rel = path[len(remote_prefix):]
                          if rel:
                              relative_paths.add(rel)
                  return relative_paths
              elif response.status_code == 404:
                  return set()
              else:
                  print(f"Aviso: Não foi possível obter a árvore remota (HTTP {response.status_code})")
                  return set()

          def ensure_remote_dir(config, remote_path):
              if remote_path in CREATED_DIRS:
                  return
              url = api_url(config, f"/files/path{quote(remote_path, safe='/')}")
              response = config["session"].post(url, timeout=60)
              if response.status_code not in (200, 201, 204, 400, 409):
                  raise SystemExit(
                      f"Não foi possível preparar diretório remoto: HTTP {response.status_code}"
                  )
              CREATED_DIRS.add(remote_path)
              time.sleep(1)

          def upload_file(config, local_path, remote_path, max_retries=3):
              remote_parent = str(Path(remote_path).parent).replace("\\", "/")
              ensure_remote_dir(config, remote_parent)
              url = api_url(config, f"/files/path{quote(remote_path, safe='/')}")

              for attempt in range(max_retries):
                  try:
                      with local_path.open("rb") as stream:
                          response = config["session"].post(
                              url,
                              files={"content": (Path(remote_path).name, stream)},
                              timeout=60,
                          )
                      if response.status_code in (200, 201):
                          time.sleep(1)
                          return True
                      if response.status_code == 429 and attempt < max_retries - 1:
                          wait = int(response.headers.get("Retry-After", "10"))
                          time.sleep(max(wait, 1))
                          continue
                      if response.status_code >= 500 and attempt < max_retries - 1:
                          time.sleep(2 ** attempt)
                          continue
                      print(f"ERRO [{response.status_code}] ao enviar {Path(remote_path).name}")
                      return False
                  except requests.RequestException as error:
                      if attempt == max_retries - 1:
                          print(f"ERRO [{type(error).__name__}] ao enviar {Path(remote_path).name}")
                          return False
                      time.sleep(2 ** attempt)

              return False

          def sync_project(config):
              project_dir = config["project_dir"]
              print(f"Pasta local: {project_dir}")
              print(f"Destino no servidor: {config['remote_dir']}\n")

              CREATED_DIRS.clear()

              with tempfile.TemporaryDirectory() as temp_dir:
                  template_file = project_dir / ".env.example"
                  if not template_file.is_file():
                      raise SystemExit("O arquivo .env.example é necessário como modelo.")

                  # Gerar .env.dev e .env.test dinamicamente
                  env_file = Path(temp_dir) / ".env.dev"
                  shutil.copyfile(template_file, env_file)
                  for name, value in config["app_env"].items():
                      set_key(str(env_file), name, value, quote_mode="never")

                  test_env_file = Path(temp_dir) / ".env.test"
                  shutil.copyfile(template_file, test_env_file)
                  for name, value in config["app_env"].items():
                      set_key(str(test_env_file), name, value, quote_mode="never")

                  # Mapear todos os arquivos locais permitidos
                  local_files_map = {}

                  for filename in ALLOWED_FILES - {".env.dev", ".env.test"}:
                      path = project_dir / filename
                      if path.is_file():
                          local_files_map[filename] = path

                  for dirname in ALLOWED_DIRS:
                      base = project_dir / dirname
                      if not base.is_dir():
                          continue
                      for root, dirs, filenames in os.walk(base):
                          dirs[:] = [d for d in dirs if d not in IGNORED_SUBDIRS]
                          for filename in filenames:
                              path = Path(root) / filename
                              relative = path.relative_to(project_dir).as_posix()
                              if path.suffix not in {".pyc", ".pyo"}:
                                  local_files_map[relative] = path

                  # Adicionar .env.dev e .env.test gerados
                  local_files_map[".env.dev"] = env_file
                  local_files_map[".env.test"] = test_env_file

                  # 1. REMOVER DO SERVIDOR O QUE NÃO EXISTE NO LOCAL
                  remote_tree = get_remote_file_tree(config)
                  deleted_count = 0

                  # Ordenamos do caminho mais longo ao mais curto para apagar arquivos antes de pastas
                  for remote_rel_path in sorted(remote_tree, key=lambda p: len(p.split('/')), reverse=True):
                      # Ignora arquivos gerados dinamicamente no servidor
                      if remote_rel_path in PROTECTED_REMOTE_FILES:
                          continue

                      # Se for arquivo/pasta de diretórios não gerenciados pelo deploy, ignora
                      root_folder = remote_rel_path.split('/')[0]
                      is_managed_path = (root_folder in ALLOWED_DIRS) or (remote_rel_path in ALLOWED_FILES)

                      if is_managed_path and remote_rel_path not in local_files_map:
                          full_remote_path = f"{config['remote_dir']}/{remote_rel_path}"
                          print(f"Removendo do servidor (obsoleto): {remote_rel_path} ...", end=" ", flush=True)
                          if delete_remote_path(config, full_remote_path):
                              print("OK")
                              deleted_count += 1
                          else:
                              print("FALHA")

                  # 2. ENVIAR / ATUALIZAR ARQUIVOS
                  ensure_remote_dir(config, config["remote_dir"])
                  uploaded_count = 0

                  for relative_path in sorted(local_files_map.keys()):
                      local_path = local_files_map[relative_path]
                      remote_path = f"{config['remote_dir']}/{relative_path}"
                      print(f"Enviando/Atualizando: {relative_path} ...", end=" ", flush=True)
                      if upload_file(config, local_path, remote_path):
                          print("OK")
                          uploaded_count += 1
                      else:
                          print("FALHA")
                          return False

                  print(f"\nSincronização concluída! {uploaded_count} enviados/atualizados, {deleted_count} removidos.")
                  return True

          def reload_webapp(config):
              url = api_url(config, f"/webapps/{quote(config['domain'], safe='')}/reload/")
              print("\nRecarregando a aplicação Web no PythonAnywhere...")
              response = config["session"].post(url, timeout=60)
              if response.status_code != 200:
                  raise SystemExit(f"Erro ao recarregar a webapp: HTTP {response.status_code}")
              print("Aplicação Web recarregada com sucesso!")

          if __name__ == "__main__":
              deploy_config = load_config()
              if sync_project(deploy_config):
                  reload_webapp(deploy_config)
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("deployed=true\n")
          PY

      - name: Notificar sucesso via Google Apps Script
        if: success() && steps.deploy.outputs.deployed == 'true'
        env:
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_WEBAPP_URL }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          DETAIL: Sincronização completa (upload/remoção) realizada e aplicação recarregada.
        run: |
          python - <<'PY'
          import datetime
          import os
          import pytz
          import requests

          payload = {
              "status": "success",
              "repositorio": os.environ["REPOSITORY"],
              "ref": os.environ["REF"],
              "autor": os.environ["ACTOR"],
              "mensagem_commit": os.environ.get("COMMIT_MESSAGE", ""),
              "run_url": os.environ["RUN_URL"],
              "ambiente": "Produção",
              "detalhe_erro": os.environ["DETAIL"],
              "timestamp": datetime.datetime.now(
                  pytz.timezone("America/Sao_Paulo")
              ).strftime("%d/%m/%Y %H:%M:%S"),
          }

          try:
              response = requests.post(os.environ["APPSCRIPT_URL"], json=payload, timeout=30)
              print(f"Resposta do Apps Script: HTTP {response.status_code}")
          except requests.RequestException as error:
              print(f"Falha ao enviar notificação: {type(error).__name__}")
          PY

      - name: Notificar falha via Google Apps Script
        if: failure() && steps.deploy.outcome == 'failure'
        env:
          APPSCRIPT_URL: ${{ secrets.APPSCRIPT_WEBAPP_URL }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
          DETAIL: A pipeline falhou durante a sincronização ou reload no PythonAnywhere.
        run: |
          python - <<'PY'
          import datetime
          import os
          import pytz
          import requests

          payload = {
              "status": "fail",
              "repositorio": os.environ["REPOSITORY"],
              "ref": os.environ["REF"],
              "autor": os.environ["ACTOR"],
              "mensagem_commit": os.environ.get("COMMIT_MESSAGE", ""),
              "run_url": os.environ["RUN_URL"],
              "ambiente": "Produção",
              "detalhe_erro": os.environ["DETAIL"],
              "timestamp": datetime.datetime.now(
                  pytz.timezone("America/Sao_Paulo")
              ).strftime("%d/%m/%Y %H:%M:%S"),
          }

          try:
              response = requests.post(os.environ["APPSCRIPT_URL"], json=payload, timeout=30)
              print(f"Resposta do Apps Script: HTTP {response.status_code}")
          except requests.RequestException as error:
              print(f"Falha ao enviar notificação: {type(error).__name__}")
          PY